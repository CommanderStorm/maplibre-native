<svg xmlns="http://www.w3.org/2000/svg" width="760" height="330" viewBox="0 0 760 330" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="12">
  <defs>
    <pattern id="sliver" width="4" height="4" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <rect width="2" height="4" fill="#dc2626"/>
    </pattern>
    <g id="grid">
      <rect x="0" y="0" width="50" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
      <rect x="50" y="0" width="50" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
      <rect x="100" y="0" width="50" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
      <rect x="0" y="50" width="50" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
      <rect x="50" y="50" width="50" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
      <rect x="100" y="50" width="50" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
      <rect x="0" y="100" width="50" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
      <rect x="50" y="100" width="50" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
      <rect x="100" y="100" width="50" height="50" fill="#f3f4f6" stroke="#9ca3af"/>
    </g>
  </defs>
  <rect width="760" height="330" fill="#ffffff"/>

  <!-- 1: the camera frames exactly one tile -->
  <g transform="translate(20,0)">
    <text x="0" y="24" font-weight="bold" fill="#111827">1. Tile mode camera</text>
    <g transform="translate(15,45)">
      <use href="#grid"/>
      <rect x="50" y="50" width="50" height="50" fill="#fde68a" stroke="#9ca3af"/>
      <rect x="50" y="50" width="50" height="50" fill="none" stroke="#111827" stroke-width="3"/>
      <circle cx="75" cy="75" r="3" fill="#111827"/>
    </g>
    <text x="0" y="222" fill="#374151">viewport = tile z/x/y</text>
    <text x="0" y="240" fill="#374151">its edges are the</text>
    <text x="0" y="258" fill="#374151">neighbours' edges</text>
  </g>

  <!-- 2: rounding puts a neighbour in the cover -->
  <g transform="translate(205,0)">
    <text x="0" y="24" font-weight="bold" fill="#111827">2. Frustum test, z16+</text>
    <g transform="translate(15,45)">
      <use href="#grid"/>
      <rect x="50" y="50" width="50" height="50" fill="#fde68a" stroke="#9ca3af"/>
      <rect x="100" y="50" width="50" height="50" fill="#fee2e2" stroke="#9ca3af"/>
      <rect x="100" y="50" width="6" height="50" fill="url(#sliver)"/>
      <rect x="50" y="50" width="56" height="50" fill="none" stroke="#111827" stroke-width="3"/>
      <circle cx="75" cy="75" r="3" fill="#111827"/>
    </g>
    <text x="0" y="222" fill="#374151">rounding pushes an edge</text>
    <text x="0" y="240" fill="#374151">into a neighbour (drawn</text>
    <text x="0" y="258" fill="#374151">huge here, real: far &lt; 1 px)</text>
    <text x="0" y="276" fill="#dc2626">"returned 2 tiles" warning</text>
  </g>

  <!-- 3: the cover is sorted by distance, the framed tile is kept -->
  <g transform="translate(390,0)">
    <text x="0" y="24" font-weight="bold" fill="#111827">3. Cover sorted by distance</text>
    <g transform="translate(0,58)">
      <rect x="0" y="0" width="165" height="30" fill="#fde68a" stroke="#9ca3af"/>
      <text x="8" y="19" fill="#111827">[0] z/x/y</text>
      <text x="157" y="19" text-anchor="end" fill="#111827">d = 0</text>
      <rect x="0" y="36" width="165" height="30" fill="#fee2e2" stroke="#9ca3af"/>
      <text x="8" y="55" fill="#111827">[1] z/x+1/y</text>
      <text x="157" y="55" text-anchor="end" fill="#111827">d = 1</text>
      <text x="8" y="88" fill="#dc2626">[1] dropped</text>
    </g>
    <text x="0" y="222" fill="#374151">Tile mode keeps [0], the</text>
    <text x="0" y="240" fill="#374151">framed tile: the render is</text>
    <text x="0" y="258" fill="#374151">correct, the warning noise</text>
  </g>

  <!-- 4: a camera that really spans tiles still warns -->
  <g transform="translate(575,0)">
    <text x="0" y="24" font-weight="bold" fill="#111827">4. Real misuse</text>
    <g transform="translate(15,45)">
      <use href="#grid"/>
      <rect x="25" y="25" width="50" height="50" fill="none" stroke="#111827" stroke-width="3"/>
      <circle cx="50" cy="50" r="3" fill="#111827"/>
    </g>
    <text x="0" y="222" fill="#374151">viewport reaches into</text>
    <text x="0" y="240" fill="#374151">4 tiles: still warns</text>
  </g>

  <line x1="20" y1="292" x2="740" y2="292" stroke="#d1d5db"/>
  <text x="20" y="316" fill="#111827"><tspan font-weight="bold">This PR:</tspan> warn only when a viewport corner lies outside tile [0]. Case 2 goes quiet, case 4 still warns.</text>
</svg>
